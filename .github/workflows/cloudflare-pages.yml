name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination _site

      - name: Prepare deployment
        run: |
          test -f _site/index.html
          rm -f _site/CNAME

      - name: Deploy site
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9a98fecbe4e4a2670887868ed0811791
          command: pages deploy _site --project-name=xiuyue-homepage --branch=main

      - name: Verify public domains
        run: |
          for url in https://xiuyue.org/ https://www.xiuyue.org/; do
            for path in index.html assets/css/main.css assets/js/main.js assets/js/statistics.js \
              images/favicon.png images/site.webmanifest \
              images/institutions/uestc-wordmark.png \
              images/project/isac-prototype-hardware.png \
              images/project/isac-cooperative-sensing-interface.png \
              images/project/isac-field-test-platform.png \
              images/project/isac-indoor-test-overview.png \
              images/project/isac-indoor-test-setup.png \
              images/rewards/jcin-youth-editorial-board-certificate.png \
              images/rewards/tnsm-exemplary-editor-2025.png \
              images/wcsp/WCSP1.jpg \
              images/wcsp/WCSP2.jpg \
              images/wcsp/WCSP3.jpg \
              assets/fonts/source-sans-3/source-sans-3-latin-normal.woff2; do
              public_path="$path"
              if [ "$path" = index.html ]; then public_path=""; fi
              for attempt in 1 2 3 4 5 6; do
                if curl --fail --silent --show-error --location --max-time 30 \
                  --output /tmp/deployed-asset "${url}${public_path}" \
                  && cmp --silent "_site/$path" /tmp/deployed-asset; then
                  break
                fi
                if [ "$attempt" -eq 6 ]; then
                  printf 'Deployment verification failed at %s%s\n' "$url" "$public_path" >&2
                  exit 1
                fi
                sleep 3
              done
              printf 'Verified deployed asset at %s%s\n' "$url" "$public_path"
            done
          done
