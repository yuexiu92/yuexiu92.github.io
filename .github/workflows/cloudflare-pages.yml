name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination _site

      - name: Prepare deployment
        run: |
          test -f _site/index.html
          rm -f _site/CNAME

      - name: Deploy site
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9a98fecbe4e4a2670887868ed0811791
          command: pages deploy _site --project-name=xiuyue-homepage --branch=main

      - name: Verify public domains
        run: |
          for url in https://xiuyue.org/ https://www.xiuyue.org/; do
            for path in index.html assets/css/main.css assets/js/main.js \
              images/institutions/uestc-wordmark.png \
              assets/fonts/source-sans-3/source-sans-3-latin-normal.woff2; do
              public_path="$path"
              if [ "$path" = index.html ]; then public_path=""; fi
              curl --fail --silent --show-error --location \
                --retry 3 --retry-delay 3 --max-time 30 \
                --output /tmp/deployed-asset "${url}${public_path}"
              cmp "_site/$path" /tmp/deployed-asset
              printf 'Verified deployed asset at %s%s\n' "$url" "$public_path"
            done
          done
