name: Update Google Scholar citations

on:
  schedule:
    # 01:00 UTC is 09:00 in Asia/Shanghai.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-scholar-citations
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install citation parser
        run: python -m pip install 'beautifulsoup4>=4.12,<5'

      - name: Test citation updater
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Refresh citation snapshot
        shell: bash
        run: python .github/scripts/update_scholar_citations.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit changed citation data
        id: commit
        run: |
          if git diff --quiet -- _config.yml _includes/about/publications.md; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- _config.yml _includes/about/publications.md
          git commit -m 'Refresh Google Scholar citation counts'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/cloudflare-pages.yml
    with:
      ref: main
    secrets: inherit
