<link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
<link rel="manifest" href="{{ '/images/site.webmanifest' | relative_url }}">

<meta name="msapplication-TileColor" content="#004098">
<meta name="theme-color" content="#004098">

{% if page.math %}
<script>
  window.MathJax = {
    tex: {
      inlineMath: { '[+]': [['$', '$']] },
      processEscapes: true,
      tags: 'all'
    }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
{% endif %}

<!-- end custom head snippets -->
