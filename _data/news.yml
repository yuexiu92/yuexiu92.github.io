- date: "2026-08"
  content_zh: >-
    Yang Zhao 等人的论文“ShardMemo: Scope-Before-Routing for Agentic Memory Retrieval”被 **Findings of EMNLP 2026** 接收。[论文链接](https://aclanthology.org/2026.findings-emnlp.1806/)
  content_en: >-
    “ShardMemo: Scope-Before-Routing for Agentic Memory Retrieval,” by Yang Zhao and coauthors, was accepted to **Findings of EMNLP 2026**. [Paper](https://aclanthology.org/2026.findings-emnlp.1806/)

- date: "2026-06"
  content_zh: >-
    受聘担任 *Journal of Communications and Information Networks*（JCIN）青年编委。[聘书](/images/rewards/jcin-youth-editorial-board-certificate.png)
  content_en: >-
    Appointed to the youth editorial board of *Journal of Communications and Information Networks* (JCIN). [Certificate](/images/rewards/jcin-youth-editorial-board-certificate.png)

