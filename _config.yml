# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
title       : "Yue Xiu (修越)"
description : "Postdoctoral Researcher at UESTC. Research in energy-efficient wireless communications, integrated sensing and communication, movable antennas, and reconfigurable intelligent surfaces."
url         : "https://xiuyue.org"
baseurl     : ""
repository  : "yuexiu92/yuexiu92.github.io"
lang        : "en"
locale      : "en_US"
theme       :

# google analytics
google_analytics_id      :  # get google_analytics_id from https://analytics.google.com/analytics/

# SEO Related
google_site_verification :  # get google_site_verification from https://search.google.com/search-console/about
bing_site_verification   :  # get bing_site_verification from https://www.bing.com/webmasters/about
baidu_site_verification  :  # get baidu_site_verification from https://ziyuan.baidu.com/login/index?u=/site/index

# Site Author
author:
  name          : "Yue Xiu"
  name_zh       : "修越"
  avatar        : "images/yue-xiu.jpg"
  bio           : "Postdoctoral Researcher, UESTC"
  bio_zh        : "电子科技大学博士后"
  affiliation   : "National Key Laboratory of Wireless Communications"
  affiliation_zh: "无线通信国家重点实验室"
  location      : "Chengdu, China"
  location_zh   : "中国 · 成都"
  email         : "yunis@uestc.edu.cn"
  googlescholar : "https://scholar.google.com/citations?user=m2X_ZS0AAAAJ"
  github        : ""


# Reading Files
include:
  - _pages
exclude:
  - .bundle
  - .DS_Store
  - .github
  - .jekyll-cache
  - .sass-cache
  - .vscode
  - _site
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - push.sh
  - run_server.sh
  - vendor
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
timezone: Asia/Shanghai


# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
